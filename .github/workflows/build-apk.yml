name: Build SUBA Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Build Android Debug APK with Gradle
        working-directory: ./frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy APK to Output
        run: |
          mkdir -p dist-apk
          find frontend/android -name "*.apk" -exec cp -v {} dist-apk/SUBA-Thirukkural.apk \;
          ls -la dist-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SUBA-Thirukkural-apk
          path: dist-apk/SUBA-Thirukkural.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Direct Download APK Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0
          name: "SUBA Thirukkural v1.0.0 (Home Screen Widget)"
          body: |
            ### 📱 SUBA Thirukkural Android App & Home Screen Widget
            - ✅ Complete offline-bundled AI Thirukkural Wisdom Chatbot
            - ✅ Native Home Screen Daily Kural Widget with "Ask SUBA" button
            - ✅ Direct download and install for Android
          files: dist-apk/SUBA-Thirukkural.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

